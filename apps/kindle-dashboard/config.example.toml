# Kindle Fridge Dashboard — example config. Copy to config.toml.
#
# Calendar source (pick one):
#  * Atlas (preferred): the local app (repo: voice-email) that already indexes
#    and merges all your calendars. Set atlas_url below; no iCal URLs needed.
#  * iCal URLs (fallback): leave atlas_url unset and fill in `calendars` with
#    each Google Calendar's Settings → Integrate calendar → "Secret address in
#    iCal format".

lat = 52.0116            # Delft
lon = 4.3571
units = "C"              # "C" or "F"
tz = "Europe/Amsterdam"
refresh_min = 20         # how often the Kindle refreshes (minutes)
server_host = "0.0.0.0"  # bind address for the LAN image server
server_port = 8713
out_dir = "./out"        # where dashboard.png is written/served from
agenda_rows = 8          # max agenda rows drawn

# Preferred: pull the agenda from the local Atlas app.
atlas_url = "http://127.0.0.1:8765"
atlas_mine = true        # only your own events (drops shared/colleague calendars)

# Fallback iCal source (used only when atlas_url is unset).
calendars = [
  # "https://calendar.google.com/calendar/ical/REPLACE%40gmail.com/private-REPLACE/basic.ics",
]
